---
layout: default
---
<article>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></div>
  {% if page.tldr %}<p class="post-tldr"><strong>TL;DR:</strong> {{ page.tldr }}</p>{% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <p class="post-back"><a href="/writing.html">← all writing</a></p>
</article>
